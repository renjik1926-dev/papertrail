# Release on a v* tag (BUILD_PLAN §13): full CI, build the frontend into the wheel, smoke-test
# the installed wheel on a clean runner, then publish a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend into the package
        run: |
          cd frontend
          npm ci
          npx vite build
          rm -rf ../backend/papertrail/static
          cp -r dist ../backend/papertrail/static
      - name: Build wheel and sdist
        working-directory: backend
        run: uv build --out-dir ../dist
      - name: The wheel contains the frontend
        run: python3 -c "import zipfile,glob,sys; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'papertrail/static/index.html' in names else 'static files missing from wheel')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  smoke:
    # BUILD_PLAN §11: install the wheel into a fresh environment and run it. The plan also
    # lists a Windows runner; this draft runs Ubuntu only.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Install the wheel as a tool and run it with the Replay provider
        env:
          PAPERTRAIL_PROVIDER: replay
          PAPERTRAIL_RECORDINGS_DIR: ${{ github.workspace }}/eval/recorded
          PAPERTRAIL_DATA_DIR: ${{ runner.temp }}/papertrail-data
        run: |
          uv tool install dist/*.whl
          papertrail --version
          papertrail doctor
          papertrail run eval/docs/tax_notice_01.pdf
          papertrail serve --port 8765 &
          server=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ | grep -q '<div id="root">'
          kill "$server"

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
