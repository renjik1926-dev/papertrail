# pre-commit hooks (BUILD_PLAN §5). Install with `uvx pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--config, backend/pyproject.toml]
        files: ^(backend|eval)/.*\.py$
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        files: ^(backend|eval)/.*\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.(pdf|json)$
      - id: check-added-large-files
        args: [--maxkb=600]
  - repo: local
    hooks:
      - id: no-stray-pdfs
        name: PDFs only in eval/docs/ and backend/tests/fixtures/
        entry: PDFs may only be committed to eval/docs/ or backend/tests/fixtures/ (never real letters)
        language: fail
        files: \.pdf$
        exclude: ^(eval/docs/|backend/tests/fixtures/)
